<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AniBT Torrent Parser — online torrent file parser and editor">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eff1f5">
  <title>Torrent Parser · AniBT</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('torrent-parser_theme');
        var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        // Catppuccin Mocha / Latte base for first paint
        root.style.backgroundColor = dark ? '#1e1e2e' : '#eff1f5';
        root.style.color = dark ? '#cdd6f4' : '#4c4f69';
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
